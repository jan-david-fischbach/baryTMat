[project]
name = "barytmat"
version = "0.2.0"
description = "A small library handling T-matrices in barycentric rational form compatible to the T-matrix data format."
readme = "README.md"
authors = [
    { name = "Jan David Fischbach", email = "mail@jan-dav.id" }
]
requires-python = ">=3.10"
dependencies = [
    "diffaaable>=1.1.1",
    "h5py>=3.13.0",
    "treams>=0.4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
tag_name = "v{new_version}"
commit_message = "chore: bump version to {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'